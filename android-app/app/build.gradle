apply plugin: 'com.android.application'

android {
    namespace 'ng.edu.abma.aimsresults'
    compileSdk 34

    defaultConfig {
        applicationId "ng.edu.abma.aimsresults"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
